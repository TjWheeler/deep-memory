name: deep-memory-indexer

services:
  vllm-embeddings:
    image: vllm/vllm-openai:latest
    container_name: deep-memory-embeddings
    runtime: nvidia
    profiles:
      - embeddings
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "8010:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - "Qwen/Qwen3-Embedding-8B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "auto"
      - "--quantization"
      - "fp8"
      - "--max-model-len"
      - "8192"
      - "--gpu-memory-utilization"
      - "0.50"
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --- Extraction Workers (one at a time — start via profile) ---
  # All workers expose port 8020 so the indexer config doesn't need to change.
  # Only run ONE worker profile at a time since they share the GPU.

  vllm-worker-qwen3-4b:
    image: vllm/vllm-openai:latest
    container_name: deep-memory-worker-qwen3-4b
    runtime: nvidia
    profiles:
      - worker-qwen3-4b
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "8020:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - "Qwen/Qwen3-4B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "auto"
      - "--max-model-len"
      - "32768"
      - "--gpu-memory-utilization"
      - "0.90"
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vllm-worker-qwen3-8b:
    image: vllm/vllm-openai:latest
    container_name: deep-memory-worker-qwen3-8b
    runtime: nvidia
    profiles:
      - worker-qwen3-8b
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "8020:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - "Qwen/Qwen3-8B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "auto"
      - "--max-model-len"
      - "32768"
      - "--gpu-memory-utilization"
      - "0.90"
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vllm-worker-qwen3-14b:
    image: vllm/vllm-openai:latest
    container_name: deep-memory-worker-qwen3-14b
    runtime: nvidia
    profiles:
      - worker-qwen3-14b
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "8020:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - "Qwen/Qwen3-14B-AWQ"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "float16"
      - "--quantization"
      - "awq_marlin"
      - "--max-model-len"
      - "65536"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--kv-cache-dtype"
      - "fp8"
      - "--enable-prefix-caching"
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vllm-worker-qwen35-35b:
    image: vllm/vllm-openai:latest
    container_name: deep-memory-worker-qwen35-35b
    runtime: nvidia
    profiles:
      - worker-qwen35-35b
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "8020:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - "Qwen/Qwen3.5-35B-A3B-GPTQ-Int4"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "float16"
      - "--quantization"
      - "gptq_marlin"
      - "--max-model-len"
      - "65536"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--kv-cache-dtype"
      - "fp8"
      - "--enable-prefix-caching"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_xml"
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vllm-worker-gemma3-12b:
    image: vllm/vllm-openai:latest
    container_name: deep-memory-worker-gemma3-12b
    runtime: nvidia
    profiles:
      - worker-gemma3-12b
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}  # Required — Gemma 3 is gated. Accept license at huggingface.co/google/gemma-3-12b-it then set HF_TOKEN
    ports:
      - "8020:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - "google/gemma-3-12b-it"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "bfloat16"
      - "--max-model-len"
      - "16384"
      - "--gpu-memory-utilization"
      - "0.90"
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --- Document conversion (docling-serve) ---
  # Converts PDF/DOCX/HTML/PPTX sources to Markdown before extraction. CPU-only:
  # the layout and table models are baked into the image, so no model-cache
  # volume is needed. Gated behind its own profile so a repo with no rich-format
  # sources never starts this ~4.4 GB container.
  docling-worker:
    build: ./services/docling
    container_name: deep-memory-docling
    profiles:
      - docling-worker
    ports:
      - "5001:5001"
    environment:
      # Cap CPU threading so conversion does not starve the host. Tune to the
      # available cores.
      - OMP_NUM_THREADS=${DOCLING_OMP_NUM_THREADS:-4}
      - MKL_NUM_THREADS=${DOCLING_MKL_NUM_THREADS:-4}
      - DOCLING_SERVE_ENG_LOC_NUM_WORKERS=${DOCLING_NUM_WORKERS:-2}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: "no"

volumes:
  huggingface_cache:
    # Reuses the 93 GB Huggingface model cache previously populated under the
    # legacy utaba-deep-memory compose project. Keeping the existing volume
    # avoids re-downloading every cached vLLM model (Qwen, Gemma, embeddings).
    external: true
    name: utaba-deep-memory_huggingface_cache
