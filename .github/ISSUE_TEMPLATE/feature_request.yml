name: Feature request
description: Suggest a new capability or improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Tell us what problem you're trying to solve — the "why" matters as much as the "what".

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do? What's painful or impossible today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What change would you like to see? An API sketch, a behaviour change, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they didn't fit.
    validations:
      required: false

  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - "@utaba/deep-memory (core)"
        - "@utaba/deep-memory-embeddings-openai"
        - "@utaba/deep-memory-storage-cosmosdb"
        - "@utaba/deep-memory-storage-sqlserver"
        - "@utaba/deep-memory-local-mcp-server"
        - "@utaba/deep-memory-indexer"
        - "@utaba/deep-memory-indexer-llm-anthropic"
        - "@utaba/deep-memory-indexer-mcp-server"
        - "Multiple / not sure"
        - "Other (repo-level, docs, tooling)"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links to related issues, prior art in other libraries, etc.
    validations:
      required: false
